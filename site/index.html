<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>craft · suspense.site</title>
  <meta name="description" content="A small lab running on a 2C2G box in Tokyo." />
  <style>
    :root {
      --bg: #f6f5f1;
      --card: #ffffff;
      --ink: #1c1b19;
      --muted: #6b6860;
      --line: #e4e1d8;
      --ok: #1f8a4c;
      --bad: #c0392b;
      --accent: #3d5afe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121211;
        --card: #1b1b19;
        --ink: #ecebe6;
        --muted: #9a978e;
        --line: #2c2b28;
        --ok: #3ccf7a;
        --bad: #ff6b5b;
        --accent: #8c9eff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Hiragino Sans", sans-serif;
    }
    main { width: 100%; max-width: 560px; }
    .eyebrow {
      font: 12px/1 ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 10px 0 6px;
      font-size: 40px;
      line-height: 1.1;
      letter-spacing: -.02em;
    }
    h1 span { color: var(--accent); }
    .lead { margin: 0 0 28px; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .label { font-weight: 600; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font: 13px/1 ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--muted);
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--muted);
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 18%, transparent); }
    .dot.bad { background: var(--bad); }
    .meta {
      margin-top: 10px;
      font: 12.5px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--muted);
    }
    button {
      margin-top: 12px;
      font: inherit;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }
    button:hover { border-color: var(--muted); }
    ul.stack {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
    }
    ul.stack li { display: flex; justify-content: space-between; gap: 8px; }
    ul.stack li em { font-style: normal; color: var(--muted); }
    footer {
      margin-top: 22px;
      font-size: 12.5px;
      color: var(--muted);
    }
    @media (max-width: 420px) {
      h1 { font-size: 32px; }
      ul.stack { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Tokyo · 2C2G · Docker</div>
    <h1>craft<span>.</span></h1>
    <p class="lead">一台东京小服务器上的后端实验场。</p>

    <section class="card" aria-live="polite">
      <div class="row">
        <span class="label">API</span>
        <span class="status"><span class="dot" id="dot"></span><span id="state">检查中…</span></span>
      </div>
      <div class="meta" id="meta">GET /api/health</div>
      <button id="retry" type="button">重新检查</button>
    </section>

    <section class="card">
      <ul class="stack">
        <li>Caddy <em>HTTPS</em></li>
        <li>Node.js <em>API</em></li>
        <li>Docker <em>compose</em></li>
        <li>GitHub Actions <em>deploy</em></li>
      </ul>
    </section>

    <!-- 改这里的版本号来测试自动部署 -->
    <footer>v1 · push 到 main 自动部署</footer>
  </main>

  <script>
    const dot = document.getElementById('dot');
    const state = document.getElementById('state');
    const meta = document.getElementById('meta');

    async function check() {
      dot.className = 'dot';
      state.textContent = '检查中…';
      const t0 = performance.now();
      try {
        const res = await fetch('/api/health', { cache: 'no-store' });
        const ms = Math.round(performance.now() - t0);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        dot.className = 'dot ok';
        state.textContent = 'online';
        const serverTime = new Date(data.time).toLocaleString();
        meta.textContent = 'GET /api/health · ' + ms + ' ms · 服务器时间 ' + serverTime;
      } catch (err) {
        dot.className = 'dot bad';
        state.textContent = 'offline';
        meta.textContent = 'GET /api/health · ' + err.message;
      }
    }

    document.getElementById('retry').addEventListener('click', check);
    check();
  </script>
</body>
</html>
