<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>craft.</title>
  <style>
    :root { --bg: #f4f2ec; --ink: #1a1917; --dim: #a8a49a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f0f0e; --ink: #ecebe6; --dim: #55534d; }
    }
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-serif, "Iowan Old Style", Georgia, serif;
      overflow: hidden;
    }
    h1 {
      font-size: clamp(56px, 14vw, 160px);
      font-weight: 400;
      letter-spacing: -0.04em;
      line-height: 1;
      animation: rise 1.4s cubic-bezier(.2,.7,.2,1) both;
    }
    h1 span {
      display: inline-block;
      animation: blink 2.4s steps(1) infinite 1.4s;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); filter: blur(6px); }
      to   { opacity: 1; transform: none; filter: none; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      h1, h1 span { animation: none; }
    }
  </style>
</head>
<body>
  <h1>craft<span>.</span></h1>
</body>
</html>
